<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Learning Tools</title>
    <link rel="stylesheet" href="stylie.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8fafc; padding: 1rem;">

    <div style="background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: #1e3a8a;">Iniciar Sesión</h2>
        
        <!-- Formulario de Inicio de Sesión -->
        <form id="form-login" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="email" id="email-login" placeholder="Correo electrónico" required style="padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            
            <!-- Contenedor para la contraseña y el botón de ver/ocultar -->
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" id="pass-login" placeholder="Contraseña" required style="padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; padding-right: 40px;">
                <button type="button" id="btn-toggle-pass" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 1.1rem;" title="Mostrar contraseña">👁️</button>
            </div>

            <button type="submit" style="background-color: #2563eb; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer;">Entrar</button>
        </form>

        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #e2e8f0;">

        <!-- Botón de Google -->
        <button id="btn-google-login" type="button" style="background-color: #4285F4; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;">
            Continuar con Google
        </button>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            ¿No tienes cuenta? <a href="registro.html" style="color: #10b981; font-weight: bold;">Regístrate aquí</a>
        </p>
        <p style="text-align: center; margin-top: 0.5rem; font-size: 0.9rem;">
            <a href="index.html" style="color: #64748b; text-decoration: none;">← Volver al inicio</a>
        </p>
    </div>

    <!-- Script de Firebase y lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Mantener la sesión persistente activa
        setPersistence(auth, browserLocalPersistence);

        const provider = new GoogleAuthProvider();

        // Lógica para mostrar / ocultar contraseña
        const passInput = document.getElementById("pass-login");
        const toggleBtn = document.getElementById("btn-toggle-pass");

        toggleBtn.addEventListener("click", () => {
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleBtn.textContent = "🙈";
                toggleBtn.title = "Ocultar contraseña";
            } else {
                passInput.type = "password";
                toggleBtn.textContent = "👁️";
                toggleBtn.title = "Mostrar contraseña";
            }
        });

        // Inicio de sesión con Correo y Contraseña
        document.getElementById("form-login").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("email-login").value;
            const password = passInput.value;

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("¡Inicio de sesión exitoso!");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("Correo o contraseña incorrectos.");
                });
        });

        // Inicio de sesión con Google
        document.getElementById("btn-google-login").addEventListener("click", () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    alert(`¡Bienvenido de nuevo, ${result.user.displayName}!`);
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("Error con Google: " + error.message);
                });
        });
    </script>
</body>
</html>
