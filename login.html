<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Learning Tools</title>
    <link rel="stylesheet" href="stylie.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8fafc; padding: 1rem;">

    <div style="background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: #1e40af;">Iniciar Sesión</h2>
        
        <form id="form-login" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="email" id="email-login" placeholder="Correo electrónico" required style="padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            <input type="password" id="pass-login" placeholder="Contraseña" required style="padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            <button type="submit" style="background-color: #2563eb; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer;">Entrar</button>
        </form>

        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #e2e8f0;">

        <button id="btn-google" type="button" style="background-color: #4285F4; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;">
            Continuar con Google
        </button>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            ¿No tienes cuenta? <a href="registro.html" style="color: #2563eb; font-weight: bold;">Regístrate aquí</a>
        </p>
        <p style="text-align: center; margin-top: 0.5rem; font-size: 0.9rem;">
            <a href="index.html" style="color: #64748b; text-decoration: none;">← Volver al inicio</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
           apiKey: "AIzaSyCZdh8_P9T2I83KLlIDARgj3NcFLZsS-qY",
            authDomain: "learning-tools-auth.firebaseapp.com",
            projectId: "learning-tools-auth",
            storageBucket: "learning-tools-auth.firebasestorage.app",
            messagingSenderId: "583726502803",
            appId: "1:583726502803:web:752c083f1744864220ce66",
            measurementId: "G-V22LT0J5NP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Login con Correo
        document.getElementById("form-login").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("email-login").value;
            const password = document.getElementById("pass-login").value;

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("¡Inicio de sesión exitoso!");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("Correo o contraseña incorrectos.");
                });
        });

        // Login con Google
        document.getElementById("btn-google").addEventListener("click", () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    alert(`¡Bienvenido ${result.user.displayName}!`);
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("Error con Google: " + error.message);
                });
        });
    </script>
</body>
</html>
